# Meeting Brief AI summary - prompt test suite. Write every description (the expected
# behaviour, as properties) BEFORE the first run, together, and record who wrote it.
# Rebuild the fixtures first:  python promptfoo/brief_summary/build.py  (repository root)

- description: "T1 typical, mixed records: EXPECTED BEHAVIOUR WRITTEN BEFORE THE RUN"
  vars: {input: file://fixtures/t1_mixed.txt, expect_status: ok, must_cite: B1, must_kind: blocker}
  assert:
    - {type: javascript, value: file://checks.js:bareJson, metric: Format}
    - {type: javascript, value: file://checks.js:schema, metric: Schema}
    - {type: javascript, value: file://checks.js:citedIdsExist, metric: Schema}
    - {type: javascript, value: file://checks.js:citesRecord, metric: Correctness}

- description: "T2 typical, open action after a decision: EXPECTED BEHAVIOUR WRITTEN BEFORE THE RUN"
  vars: {input: file://fixtures/t2_follow_up.txt, expect_status: ok, must_cite: A1, must_kind: follow_up}
  assert:
